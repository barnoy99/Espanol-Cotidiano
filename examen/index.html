<style>
  :root {
    --bg: #fbf6ee; --card: #ffffff; --ink: #2a2522; --muted: #6d625a;
    --accent: #b3412e; --accent-ink: #ffffff; --soft: #f3e3d3; --line: #e4d6c7;
    --ok: #2f7d4f; --fs: 21px;
  }
  * { box-sizing: border-box; }
  html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif; line-height: 1.45; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex;
    align-items: center; gap: 10px; }
  header .title { font-weight: bold; flex: 1; font-size: 0.85rem; color: var(--accent); }
  header button { font-size: 0.8rem; padding: 6px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .bar { height: 8px; background: var(--soft); }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 120px; }
  .section { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 6px; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; line-height: 1.25; }
  h2 { font-size: 1.15rem; margin: 0 0 14px; line-height: 1.3; }
  p { margin: 0 0 14px; }
  .hint { color: var(--muted); font-size: 0.85rem; }
  .es { font-size: 1.2rem; background: var(--card); border: 1px solid var(--line);
    border-left: 5px solid var(--accent); border-radius: 12px; padding: 14px 16px;
    margin: 0 0 16px; }
  .opts { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; }
  .opt { text-align: left; font: inherit; font-size: 1rem; padding: 14px 16px;
    border-radius: 14px; border: 2px solid var(--line); background: var(--card);
    color: var(--ink); min-height: 56px; }
  .opt.sel { border-color: var(--accent); background: var(--soft); }
  .opt.idk { border-style: dashed; color: var(--muted); font-size: 0.9rem; min-height: 48px; }
  textarea { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px;
    border-radius: 12px; border: 2px solid var(--line); background: var(--card);
    color: var(--ink); min-height: 120px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .btn { font: inherit; font-size: 1rem; padding: 14px 20px; border-radius: 14px;
    border: none; background: var(--accent); color: var(--accent-ink); min-height: 56px; }
  .btn.soft { background: var(--soft); color: var(--ink); }
  .btn.rec { background: #1f5f8b; }
  .btn.rec.on { background: #c0392b; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .btn:disabled { opacity: .45; }
  .scale { display: flex; gap: 8px; margin: 6px 0 4px; }
  .scale .opt { flex: 1; text-align: center; padding: 12px 0; min-height: 54px; }
  .scale-lbl { display: flex; justify-content: space-between; font-size: 0.75rem;
    color: var(--muted); margin-bottom: 16px; }
  .sub { font-weight: bold; margin: 16px 0 4px; font-size: 1rem; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  footer .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  footer .btn { flex: 1; }
  footer .back { flex: 0 0 auto; }
  .center { text-align: center; }
  .big { font-size: 3rem; margin: 10px 0; }
  .saved { font-size: 0.75rem; color: var(--ok); min-height: 1em; }
</style>
</head>

  ];

  // ── State ─────────────────────────────────────────────
  var state = load() || { sid: Date.now().toString(36), step: 0, ans: {}, startedAt: new Date().toISOString(), fs: 21 };
  function load() { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; } }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

  var db = null;
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); } catch (e) {}
  var pushTimer = null;
  function save() {
    state.updatedAt = new Date().toISOString();
    saveLocal();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 600);
  }
  function push() {
    if (!db) return;
    var out = { sid: state.sid, startedAt: state.startedAt, updatedAt: state.updatedAt,
      step: state.step, stepId: STEPS[state.step].id, finished: !!state.finished,
      ua: navigator.userAgent, summary: summary(), answers: state.ans };
    db.ref(DB_PATH + '/' + state.sid).set(JSON.parse(JSON.stringify(out))).catch(function () {});
  }

  function summary() {
    var by = {};
    STEPS.forEach(function (s) {
      if (s.type !== 'mcq' && s.type !== 'listen') return;
      var k = (s.type === 'mcq' ? 'read_' : 'listen_') + s.lvl;
      by[k] = by[k] || { ok: 0, of: 0 };
      by[k].of++;
      var r = state.ans[s.id];
      if (r && r.correct) by[k].ok++;
    });
    return by;
  }

  // ── Speech ────────────────────────────────────────────
  var voice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
    voice = vs.filter(function (v) { return /es[-_]ES/i.test(v.lang); })[0] || vs[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, rate) {
    if (!window.speechSynthesis) return false;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'es-ES';
    if (voice) u.voice = voice;
    u.rate = rate;
    speechSynthesis.speak(u);
    return true;
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  function startRec(btn, ta, onText) {
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'es-ES'; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 1;
    btn.classList.add('on'); btn.textContent = '⏹ J\'écoute… (toucher pour arrêter)';
    rec.onresult = function (e) {
      var t = '';
      for (var i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript;
      if (t) { ta.value = (ta.value ? ta.value.trim() + ' ' : '') + t.trim(); onText(); }
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
        alert('Le micro n\'est pas autorisé. Vous pouvez écrire votre réponse, ou utiliser le micro du clavier.');
    };
    rec.onend = function () { rec = null; btn.classList.remove('on'); btn.textContent = '🎤 Parler'; };
    try { rec.start(); } catch (e) { rec = null; btn.classList.remove('on'); btn.textContent = '🎤 Parler'; }
  }

  // ── Rendering ─────────────────────────────────────────
  var main = document.getElementById('main');
  var nextBtn = document.getElementById('next');
  var backBtn = document.getElementById('back');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // Options are shuffled once per question and the order kept, so a resumed
  // session shows the same layout. Order is stored as indices into s.opts.
  function order(s) {
    state.order = state.order || {};
    if (!state.order[s.id]) {
      var o = s.opts.map(function (_, i) { return i; });
      for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = o[i]; o[i] = o[j]; o[j] = t; }
      state.order[s.id] = o;
      saveLocal();
    }
    return state.order[s.id];
  }

  function ans(id) { return state.ans[id] || (state.ans[id] = {}); }

  function render() {
    if (rec) rec.stop();
    if (window.speechSynthesis) speechSynthesis.cancel();
    var s = STEPS[state.step];
    document.getElementById('bar').style.width = Math.round(100 * state.step / (STEPS.length - 1)) + '%';
    backBtn.style.visibility = state.step === 0 || s.type === 'done' ? 'hidden' : 'visible';
    nextBtn.style.display = s.type === 'done' ? 'none' : '';
    nextBtn.textContent = state.step === 0 ? 'Commencer ▶' : 'Continuer ▶';
    var h = '';
    var a = ans(s.id);

    if (s.type === 'info') h = s.html;

    else if (s.type === 'choice' || s.type === 'multi') {
      h = '<div class="section">' + esc(s.sec) + '</div><h2>' + esc(s.q) + '</h2>' +
        (s.hint ? '<p class="hint">' + esc(s.hint) + '</p>' : '') + '<div class="opts">';
      s.opts.forEach(function (o, i) {
        var sel = s.type === 'multi' ? (a.v || []).indexOf(o) >= 0 : a.v === o;
        h += '<button class="opt' + (sel ? ' sel' : '') + '" data-i="' + i + '">' + esc(o) + '</button>';
      });
      h += '</div>';
      if (s.other || s.type === 'multi') h += '<p class="hint">' + esc(s.other || 'Autre chose ? (facultatif)') + '</p><textarea data-other rows="2" style="min-height:70px">' + esc(a.other || '') + '</textarea>';
    }

    else if (s.type === 'scale') {
      h = '<div class="section">' + esc(s.sec) + '</div><h2>' + esc(s.q) + '</h2>';
      a.v = a.v || {};
      s.items.forEach(function (it, k) {
        h += '<div class="sub">' + esc(it) + '</div><div class="scale">';
        for (var n = 1; n <= 5; n++) h += '<button class="opt' + (a.v[it] === n ? ' sel' : '') + '" data-k="' + k + '" data-n="' + n + '">' + n + '</button>';
        h += '</div><div class="scale-lbl"><span>' + esc(s.lo) + '</span><span>' + esc(s.hi) + '</span></div>';
      });
    }

    else if (s.type === 'text') {
      h = '<div class="section">' + esc(s.sec) + '</div><h2>' + esc(s.q) + '</h2>' +
        '<textarea data-free placeholder="' + esc(s.ph || '') + '">' + esc(a.v || '') + '</textarea>';
    }

    else if (s.type === 'mcq' || s.type === 'listen') {
      var part = s.type === 'mcq' ? 'Lire' : 'Écouter';
      var list = STEPS.filter(function (x) { return x.type === s.type; });
      h = '<div class="section">' + part + ' — ' + (list.indexOf(s) + 1) + ' / ' + list.length + '</div>';
      if (s.type === 'mcq') h += '<h2>' + esc(s.q) + '</h2><div class="es" lang="es">' + esc(s.es) + '</div>' + (s.ask ? '<h2>' + esc(s.ask) + '</h2>' : '');
      else {
        h += '<div class="row"><button class="btn" data-play="1">🔊 Écouter</button><button class="btn soft" data-play="slow">🐢 Plus lentement</button></div>';
        h += a.shown ? '<div class="es" lang="es">' + esc(s.es) + '</div>' : '';
        h += '<h2>' + esc(s.ask) + '</h2>';
      }
      h += '<div class="opts">';
      order(s).forEach(function (i) {
        h += '<button class="opt' + (a.pick === i ? ' sel' : '') + '" data-pick="' + i + '"' + (s.type === 'mcq' && s.q === 'Complétez :' ? ' lang="es"' : '') + '>' + esc(s.opts[i]) + '</button>';
      });
      h += '<button class="opt idk' + (a.pick === -1 ? ' sel' : '') + '" data-pick="-1">🤷 ' + IDK + '</button></div>';
      if (s.type === 'listen' && !a.shown) h += '<p class="hint"><button class="btn soft" data-show style="font-size:0.85rem;min-height:44px;padding:8px 14px">Je n\'entends rien — afficher la phrase</button></p>';
    }

    else if (s.type === 'produce' || s.type === 'talk') {
      var lst = STEPS.filter(function (x) { return x.type === s.type; });
      h = '<div class="section">' + (s.type === 'produce' ? 'Dire en espagnol' : 'Conversation') + ' — ' + (lst.indexOf(s) + 1) + ' / ' + lst.length + '</div>';
      if (s.type === 'produce') {
        h += '<h2>Comment dit-on en espagnol :</h2><div class="es">' + esc(s.fr) + '</div>';
      } else {
        h += '<div class="row"><button class="btn" data-play="1">🔊 Écouter la question</button><button class="btn soft" data-play="slow">🐢</button></div>';
        h += a.shown ? '<div class="es" lang="es">' + esc(s.es) + '</div>'
          : '<p><button class="btn soft" data-show style="font-size:0.85rem;min-height:44px;padding:8px 14px">Voir la question écrite</button></p>';
        h += '<h2>Votre réponse en espagnol :</h2>';
      }
      h += '<textarea data-free lang="es" autocapitalize="sentences" placeholder="Écrivez ici, ou touchez 🎤 Parler">' + esc(a.v || '') + '</textarea>';
      h += '<div class="row" style="margin-top:10px">' + (SR ? '<button class="btn rec" data-rec>🎤 Parler</button>' : '') +
        '<button class="btn soft" data-clear>Effacer</button></div>';
      if (!SR) h += '<p class="hint">Pour parler au lieu d\'écrire, touchez le petit micro 🎤 du clavier.</p>';
      if (s.type === 'talk') h += '<button class="opt idk' + (a.noUnderstand ? ' sel' : '') + '" data-nu style="width:100%">🤷 Je n\'ai pas compris la question</button>';
      h += '<div class="saved" data-saved></div>';
    }

    else if (s.type === 'done') {
      state.finished = true; state.finishedAt = new Date().toISOString(); save();
      h = '<div class="center big">🎉</div><h1 class="center">¡Muchas gracias, Fanny!</h1>' +
        '<p>C\'est terminé. Vos réponses sont bien enregistrées : je vais pouvoir préparer une application adaptée à votre niveau et à vos envies.</p>' +
        '<p>Vous pouvez fermer cette page.</p>' +
        '<p class="center"><button class="btn soft" data-restart style="font-size:0.8rem">Revenir au début</button></p>';
    }

    main.innerHTML = h;
    window.scrollTo(0, 0);
    wire(s);
  }

  function wire(s) {
    var a = ans(s.id);
    var q = function (sel) { return main.querySelector(sel); };
    var qa = function (sel) { return Array.prototype.slice.call(main.querySelectorAll(sel)); };

    var t = q('[data-test-tts]');
    if (t) t.onclick = function () { if (!speak('Hola Fanny, ¿me oye bien?', 0.9)) alert('Ce téléphone ne peut pas lire l\'espagnol à voix haute.'); };

    if (s.type === 'choice' || s.type === 'multi') {
      qa('.opt').forEach(function (b) {
        b.onclick = function () {
          var o = s.opts[+b.dataset.i];
          if (s.type === 'choice') { a.v = o; qa('.opt').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); }
          else {
            a.v = a.v || [];
            var k = a.v.indexOf(o);
            if (k >= 0) a.v.splice(k, 1); else a.v.push(o);
            b.classList.toggle('sel');
          }
          save();
        };
      });
      var ot = q('[data-other]');
      if (ot) ot.oninput = function () { a.other = ot.value; save(); };
    }

    if (s.type === 'scale') {
      qa('.opt').forEach(function (b) {
        b.onclick = function () {
          var it = s.items[+b.dataset.k];
          a.v[it] = +b.dataset.n;
          qa('.opt[data-k="' + b.dataset.k + '"]').forEach(function (x) { x.classList.remove('sel'); });
          b.classList.add('sel');
          save();
        };
      });
    }

    var free = q('[data-free]');
    if (free) {
      free.oninput = function () {
        a.v = free.value; a.typed = true; save();
        var sv = q('[data-saved]'); if (sv) sv.textContent = '';
      };
    }

    qa('[data-play]').forEach(function (b) {
      b.onclick = function () {
        var slow = b.dataset.play === 'slow';
        var rate = slow ? 0.6 : (s.fast ? 1.05 : 0.9);
        if (!speak(s.es, rate)) { alert('Ce téléphone ne peut pas lire l\'espagnol à voix haute. Touchez « afficher la phrase ».'); return; }
        a.plays = (a.plays || 0) + 1;
        if (slow) a.slowPlays = (a.slowPlays || 0) + 1;
        save();
      };
    });
    var sh = q('[data-show]');
    if (sh) sh.onclick = function () { a.shown = true; save(); render(); };

    qa('[data-pick]').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.pick;
        a.pick = i;
        a.lvl = s.lvl;
        a.choice = i === -1 ? IDK : s.opts[i];
        a.correct = i === s.a;
        qa('[data-pick]').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        save();
      };
    });

    var rb = q('[data-rec]');
    if (rb) rb.onclick = function () {
      a.spoke = true;
      startRec(rb, free, function () { a.v = free.value; save(); var sv = q('[data-saved]'); if (sv) sv.textContent = '✓ enregistré'; });
    };
    var cl = q('[data-clear]');
    if (cl) cl.onclick = function () { free.value = ''; a.v = ''; save(); };
    var nu = q('[data-nu]');
    if (nu) nu.onclick = function () { a.noUnderstand = !a.noUnderstand; nu.classList.toggle('sel'); save(); };

    if (s.type === 'produce' || s.type === 'talk') { a.lvl = s.lvl; a.prompt = s.fr || s.es; }

    var rs = q('[data-restart]');
    if (rs) rs.onclick = function () { state.step = 0; save(); render(); };

    // Auto-play the Spanish once on arrival for listening/conversation items.
    if ((s.type === 'listen' || s.type === 'talk') && !a.plays) {
      setTimeout(function () { if (speak(s.es, s.fast ? 1.05 : 0.9)) { a.plays = 1; save(); } }, 500);
    }
  }

  nextBtn.onclick = function () {
    var s = STEPS[state.step];
    var a = state.ans[s.id] || {};
    if ((s.type === 'mcq' || s.type === 'listen') && a.pick === undefined) {
      alert('Choisissez une réponse — ou « Je ne sais pas ».');
      return;
    }
    if (s.type === 'produce' || s.type === 'talk') {
      if (!(a.v || '').trim()) a.skipped = true; else delete a.skipped;
    }
    state.step = Math.min(state.step + 1, STEPS.length - 1);
    save(); render();
  };
  backBtn.onclick = function () { state.step = Math.max(0, state.step - 1); save(); render(); };

  function setFs(n) { state.fs = Math.max(16, Math.min(30, n)); document.documentElement.style.setProperty('--fs', state.fs + 'px'); saveLocal(); }
  document.getElementById('aplus').onclick = function () { setFs(state.fs + 2); };
  document.getElementById('aminus').onclick = function () { setFs(state.fs - 2); };
  setFs(state.fs || 21);

  if (state.step >= STEPS.length) state.step = 0;
  render();
  push();
})();
</script>
</body>
</html>
